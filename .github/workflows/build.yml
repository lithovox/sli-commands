name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # build on the oldest supported Ubuntu so the binaries run on older glibc versions
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: ""
          - os: windows-latest
            platform: windows-x86_64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build

      - name: Build executables
        run: |
          for tool in kj2bj bj2kj; do
            # the package metadata holds the version shown by --version
            uv run --group build pyinstaller --onefile --copy-metadata settlement --name "$tool" "packaging/$tool.py"
          done

      - name: Smoke test
        run: |
          mkdir smoke
          cp tests/fixtures/koppejan.sli smoke/calculation.sli
          dist/kj2bj${{ matrix.exe }} smoke/calculation.sli examples/soils.csv
          dist/bj2kj${{ matrix.exe }} smoke/calculation.bj.sli examples/soils.csv
          test -f smoke/calculation.kj.sli
          test "$(dist/kj2bj${{ matrix.exe }} --version | tr -d '\r')" = "kj2bj $(uv version --short)"

      - name: Package
        run: |
          name="kj2bj-bj2kj-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}"
          mkdir "$name"
          cp dist/kj2bj${{ matrix.exe }} dist/bj2kj${{ matrix.exe }} examples/soils.csv "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
