name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # the browser tests build the site in web/dist and run against that build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist/

  # every push to master publishes the site on https://sli.lithovox.nl
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, web]
    runs-on: ubuntu-latest
    concurrency: deploy-sli
    env:
      HOST: deploy@167.235.135.169
      APP: /var/www/apps/sli
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # upload to a new release folder and switch the symlink in one move, so
      # visitors never see a half-uploaded site; keeps the 5 most recent releases
      - name: Upload and switch release
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          rsync -az --delete dist/ "$HOST:$APP/releases/$release/"
          ssh "$HOST" "set -e
            ln -sfn $APP/releases/$release $APP/current.tmp
            mv -T $APP/current.tmp $APP/current
            cd $APP/releases && ls -1 | sort | head -n -5 | xargs -r rm -rf"

      - name: Check the site
        run: curl -fsS https://sli.lithovox.nl/ | grep -q "<html"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # build on the oldest supported Ubuntu so the binaries run on older glibc versions
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: ""
          - os: windows-latest
            platform: windows-x86_64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build

      - name: Build executable
        run: |
          # the package metadata holds the version shown by --version
          uv run --group build pyinstaller --onefile --copy-metadata settlement --name slicmd packaging/slicmd.py

      - name: Smoke test
        run: |
          mkdir smoke
          cp tests/fixtures/koppejan.sli smoke/calculation.sli
          dist/slicmd${{ matrix.exe }} -kj2bj smoke/calculation.sli examples/soils.csv
          dist/slicmd${{ matrix.exe }} -bj2kj smoke/calculation.bj.sli examples/soils.csv
          test -f smoke/calculation.kj.sli
          dist/slicmd${{ matrix.exe }} -i tests/fixtures/terzaghi.sld -vt 2 | grep -q "0.2500000"
          test "$(dist/slicmd${{ matrix.exe }} -v | tr -d '\r')" = "slicmd $(uv version --short)"

      # fixed names, the download links in README.md depend on them
      - name: Package
        run: |
          name="slicmd-${{ matrix.platform }}"
          mkdir "$name"
          cp dist/slicmd${{ matrix.exe }} examples/soils.csv "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz

  # every push to master replaces the 'latest' release that README.md links to
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency: latest-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Replace the latest release
        run: |
          version="$(uv version --short)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest *.zip *.tar.gz \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (version $version)" \
            --notes "Built automatically from master at commit $GITHUB_SHA."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
